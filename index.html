<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Production-Grade Product Catalog with Advanced Multi-Dimensional Filtering, Deterministic Sorting, and Resilient Pagination." />
  <meta name="theme-color" content="#0b0f19" />
  <title>AuraCatalog — Premium Product Catalog &amp; Filter Engine</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Design System & Component Stylesheets -->
  <link rel="stylesheet" href="./src/styles/tokens.css" />
  <link rel="stylesheet" href="./src/styles/base.css" />
  <link rel="stylesheet" href="./src/styles/components.css" />
  <link rel="stylesheet" href="./src/styles/animations.css" />
</head>
<body>
  <!-- Root Application Container -->
  <div id="app"></div>

  <!-- Screen Reader Announcements -->
  <div id="sr-announcements" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Application Bootstrap -->
  <script type="module">
    import { App } from './src/ui/App.js';

    function bootstrap() {
      const appRoot = document.getElementById('app');
      if (appRoot) {
        new App(appRoot);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrap);
    } else {
      bootstrap();
    }
  </script>
</body>
</html>
